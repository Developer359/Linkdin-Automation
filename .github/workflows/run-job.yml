name: Automated Job Pipeline

on:
  schedule:
    - cron: '*/5 * * * *' # Temporary test schedule: runs every 5 minutes
  workflow_dispatch: # Lets you trigger a manual test run anytime

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies with uv
        run: |
          uv pip install --system -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Validate secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        shell: bash
        run: |
          echo "[*] Validating environment secrets..."
          
          # Check Gemini Key
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing or empty."
            exit 1
          fi

          # Check Supabase URL
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is missing or empty."
            exit 1
          fi

          # Check Supabase Key
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_KEY secret is missing or empty."
            exit 1
          fi

          echo "[✓] All required secrets are present."

      - name: Run main script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
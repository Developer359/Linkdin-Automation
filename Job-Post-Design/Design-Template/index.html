<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Poppins', 'sans-serif'],
          script: ['Dancing Script', 'cursive'],

  .bg-teal-panel{

  }
  .text-stroke{ -webkit-text-stroke: 1px rgba(15,60,75,0.15); }
</style>
</head>

        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FA9C9"/><stop offset="1" stop-color="#0F7C97"/></linearGradient></defs>

        <polygon points="30,4 56,50 30,50" fill="#0d6c85" opacity="0.55"/>

    </div>

      <svg viewBox="0 0 60 60" class="drop-shadow-[0_6px_10px_rgba(0,0,0,0.18)]">
        <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FA9C9"/><stop offset="1" stop-color="#0F7C97"/></linearGradient></defs>

        <defs>

            <stop offset="0" stop-color="#f5f7f8"/>
            <stop offset="0.55" stop-color="#e2e8ea"/>

            <stop offset="0.6" stop-color="#1CA0BE"/>

        </g>

        <!-- main large megaphone body (cone) -->
        <g transform="translate(46,4) rotate(-4)">
          <path d="M40 118
                   C40 104 50 92 64 86
                   L210 30
                   C232 22 252 40 252 66
                   L252 186
                   C252 212 232 230 210 222
                   L64 166

          <path d="M22 140 C10 156 8 186 24 206 C34 218 52 220 62 208 L70 194 L38 158 Z"

          <rect x="14" y="118" width="16" height="20" rx="4" fill="url(#tealGrad)" stroke="#0a212b" stroke-width="3"/>

      <p class="font-sans font-extrabold text-[21px] text-navy">Join Our Team</p>

    <!-- open positions pill -->
    <div class="absolute top-[236px] right-6 z-[6] bg-teal text-white font-bold text-[15px] px-[22px] py-2 rounded-full shadow-[0_8px_16px_-6px_rgba(31,169,201,0.55)]">

        <span class="font-normal text-[#3E525B]">(4 Positions)</span>

    </div>

    <!-- arrow -->
    <div class="absolute top-[352px] right-[70px] w-[52px] z-[6]">
      <svg viewBox="0 0 60 60" fill="none">
        <path d="M8 6 C6 26 18 44 40 48" stroke="#173544" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M30 45 L40 48 L38 38" stroke="#173544" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- apply now button -->

      <svg viewBox="0 0 24 24" class="w-[11px] h-[11px] fill-none stroke-white stroke-2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>

      <p class="font-bold text-[14.5px] text-teal-dark m-0 mb-1">Mehroz@digixvalley.com</p>
      <p class="font-medium text-[11.5px] text-[#8b9aa1] m-0">0333-6362519</p>
